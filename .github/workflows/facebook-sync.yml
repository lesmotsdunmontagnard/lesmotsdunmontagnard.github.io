name: Facebook vers le recueil
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier l’activation
        id: active
        run: node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('content/facebook-sync.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled='+c.enabled+'\n');"
      - name: Vérifier l’importeur
        if: steps.active.outputs.enabled == 'true'
        run: node --test scripts/facebook-sync.test.mjs
      - name: Lire les publications de la Page
        if: steps.active.outputs.enabled == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: node scripts/facebook-sync.mjs
      - name: Valider et construire
        if: steps.active.outputs.enabled == 'true'
        run: |
          node scripts/test.mjs
          node scripts/build.mjs
      - name: Enregistrer les changements autorisés
        if: steps.active.outputs.enabled == 'true'
        id: commit
        run: |
          git add content
          if [ -d assets/poemes/facebook-page ]; then git add assets/poemes/facebook-page; fi
          if [ -d assets/actualites/facebook-page ]; then git add assets/actualites/facebook-page; fi
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached --name-only | grep -Eq '^(content/poemes.json|content/actualites.json)$'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
          git config user.name 'Recueil Facebook'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchroniser les nouvelles publications Facebook'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: public
  deploy:
    needs: import
    if: needs.import.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le recueil
        id: deployment
        uses: actions/deploy-pages@v4
